<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Item Details – FindIT</title>
  <meta name="description" content="View complete details, location, status, and submit claims for campus items.">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="search">
  <div id="site-header"></div>

  <main class="container" id="view" aria-live="polite"></main>

  <!-- Claim Modal Dialog -->
  <dialog id="claimDialog" aria-labelledby="claimTitle">
    <form id="claimForm" method="dialog" novalidate>
      <div class="dialog-head">
        <h3 id="claimTitle">Contact Reporter &amp; Claim Item</h3>
        <button class="btn btn-outline btn-sm" type="button" id="cCancel" aria-label="Close dialog">&times;</button>
      </div>
      <p class="hint" style="margin-top:0;margin-bottom:16px;">
        Describe unique identifiers or characteristics that only the legitimate owner would know. Your message will be securely shared with the reporter.
      </p>
      <div class="field" style="margin-bottom:14px;">
        <label for="cName">Your Name <span class="req">*</span></label>
        <input id="cName" maxlength="60" placeholder="Enter your full name" required>
        <span class="error"></span>
      </div>
      <div class="field" style="margin-bottom:14px;">
        <label for="cContact">Your Contact Email or Phone <span class="req">*</span></label>
        <input id="cContact" maxlength="60" placeholder="e.g. student@kiet.edu or 9876543210" required>
        <span class="error"></span>
      </div>
      <div class="field" style="margin-bottom:14px;">
        <label for="cMsg">Ownership Proof &amp; Verification Details <span class="req">*</span></label>
        <textarea id="cMsg" maxlength="400" style="min-height:95px" placeholder="e.g. State the lock screen wallpaper, specific cards inside, marks or distinctive keychain..." required></textarea>
        <span class="error"></span>
      </div>
      <div class="dialog-actions">
        <button class="btn btn-outline btn-sm" type="button" id="cCancelBtn">Cancel</button>
        <button class="btn btn-primary btn-sm" type="submit">Submit Claim Message</button>
      </div>
    </form>
  </dialog>

  <!-- Edit Listing Modal Dialog (Restricted to Listing Creator) -->
  <dialog id="editDialog" aria-labelledby="editTitle">
    <form id="editForm" method="dialog" novalidate>
      <div class="dialog-head">
        <h3 id="editTitle">Edit Listing Details</h3>
        <button class="btn btn-outline btn-sm" type="button" id="editCancel" aria-label="Close dialog">&times;</button>
      </div>
      <p class="hint" style="margin-top:0;margin-bottom:16px;">
        Update your listing details. Note that listing ownership and creation timestamp are immutable.
      </p>
      <div class="field" style="margin-bottom:14px;">
        <label for="editName">Item Name <span class="req">*</span></label>
        <input id="editName" maxlength="80" required>
        <span class="error"></span>
      </div>
      <div class="field" style="margin-bottom:14px;">
        <label for="editCategory">Category <span class="req">*</span></label>
        <select id="editCategory" required></select>
        <span class="error"></span>
      </div>
      <div class="field" style="margin-bottom:14px;">
        <label for="editLocation">Campus Location <span class="req">*</span></label>
        <input id="editLocation" maxlength="120" required>
        <span class="error"></span>
      </div>
      <div class="field" style="margin-bottom:14px;">
        <label for="editDescription">Description <span class="req">*</span></label>
        <textarea id="editDescription" maxlength="500" style="min-height:95px" required></textarea>
        <span class="error"></span>
      </div>
      <div class="dialog-actions">
        <button class="btn btn-outline btn-sm" type="button" id="editCancelBtn">Cancel</button>
        <button class="btn btn-primary btn-sm" type="submit">Save Changes</button>
      </div>
    </form>
  </dialog>

  <div id="site-footer"></div>

  <script src="js/auth.js"></script>
  <script src="js/app.js"></script>
  <script src="js/item.js"></script>
</body>
</html>
