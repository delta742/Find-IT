<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Browse Items – FindIT</title>
  <meta name="description" content="Discover, search, and filter lost and found items across the university campus.">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="search">
  <div id="site-header"></div>

  <main class="container">
    <div class="page-head">
      <span class="eyebrow"><span class="dot"></span> Campus Catalog</span>
      <h1>Browse Campus Items</h1>
      <p>Filter active lost and found reports by keyword, category, campus facility, or date.</p>
    </div>

    <!-- Filter Control Panel -->
    <div class="search-filter-panel">
      <form class="filters-grid" id="filters" role="search" onsubmit="return false">
        <div class="field">
          <label for="q">Search by Keyword</label>
          <input id="q" type="search" placeholder="e.g. iPhone, leather wallet, keys..." autocomplete="off">
        </div>
        <div class="field">
          <label for="cat">Category</label>
          <select id="cat"></select>
        </div>
        <div class="field">
          <label for="loc">Campus Location</label>
          <input id="loc" type="search" placeholder="e.g. Library, Canteen, Gate 2...">
        </div>
        <div class="field">
          <label for="since">Reported Since</label>
          <input id="since" type="date">
        </div>
      </form>
    </div>

    <!-- Type Selection Tabs -->
    <div class="tabs" role="tablist" aria-label="Item listing type">
      <button type="button" role="tab" data-type="all" class="on">All Listings</button>
      <button type="button" role="tab" data-type="lost">Lost Belongings</button>
      <button type="button" role="tab" data-type="found">Found Items</button>
    </div>

    <!-- Results Status & Secondary Controls -->
    <div class="result-bar">
      <div id="count" style="font-weight: 700; color: var(--text-main);" aria-live="polite">Loading items...</div>
      <div style="display:flex;gap:16px;align-items:center;flex-wrap:wrap">
        <label class="check">
          <input type="checkbox" id="showReturned"> Show resolved / returned
        </label>
        <label class="check" for="sort" style="gap:6px">
          <span>Sort:</span>
          <select id="sort" style="width:auto;padding:6px 10px;font-size:0.86rem;">
            <option value="new">Newest First</option>
            <option value="old">Oldest First</option>
            <option value="az">Item Name (A–Z)</option>
          </select>
        </label>
        <button class="btn btn-outline btn-sm" id="clear" type="button">Clear Filters</button>
      </div>
    </div>

    <!-- Results Grid -->
    <div class="grid" id="results" style="padding-bottom: 56px;"></div>
  </main>

  <div id="site-footer"></div>

  <script src="js/auth.js"></script>
  <script src="js/app.js"></script>
  <script src="js/search.js"></script>
</body>
</html>
